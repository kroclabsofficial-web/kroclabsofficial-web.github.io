<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>404 — Page Not Found | KROC LABS</title>

  <meta name="description"
        content="The page you're looking for could not be found. Return to KROC LABS and explore our digital tools.">

  <meta name="robots"
        content="noindex, nofollow">

  <meta name="theme-color"
        content="#050505">

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      background:#050505;
      color:#ffffff;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      flex-direction:column;
    }

    a{
      text-decoration:none;
    }

    /* HEADER */

    header{
      border-bottom:1px solid #1c1c1c;
      background:#050505;
    }

    .nav{
      width:min(1100px,92%);
      min-height:76px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      color:#00ff88;
      font-size:24px;
      font-weight:900;
      letter-spacing:2px;
    }

    .home-link{
      color:#999999;
      font-size:14px;
      transition:.2s;
    }

    .home-link:hover{
      color:#00ff88;
    }


    /* MAIN */

    main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:70px 20px;
      text-align:center;
    }

    .error-content{
      width:min(700px,100%);
    }

    .error-number{
      font-size:clamp(100px,25vw,190px);
      line-height:.85;
      font-weight:900;
      letter-spacing:-8px;
      color:#00ff88;
      margin-bottom:30px;
    }

    .eyebrow{
      color:#00ff88;
      font-size:12px;
      font-weight:800;
      letter-spacing:3px;
      margin-bottom:15px;
    }

    h1{
      font-size:clamp(30px,6vw,52px);
      line-height:1.1;
      margin-bottom:18px;
    }

    .description{
      max-width:570px;
      margin:0 auto 30px;
      color:#999999;
      font-size:16px;
      line-height:1.7;
    }


    /* BUTTONS */

    .actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:50px;
      padding:0 24px;
      border-radius:12px;
      font-size:14px;
      font-weight:800;
      transition:.2s;
    }

    .primary{
      background:#00ff88;
      color:#000000;
    }

    .primary:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 25px rgba(0,255,136,.18);
    }

    .secondary{
      color:#ffffff;
      border:1px solid #303030;
      background:#0a0a0a;
    }

    .secondary:hover{
      border-color:#00ff88;
      color:#00ff88;
    }


    /* FOOTER */

    footer{
      border-top:1px solid #1c1c1c;
      background:#030303;
      padding:30px 20px;
    }

    .footer-content{
      width:min(1100px,92%);
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
    }

    .footer-brand{
      color:#00ff88;
      font-weight:900;
      letter-spacing:2px;
    }

    .footer-text{
      color:#666666;
      font-size:13px;
    }


    /* MOBILE */

    @media(max-width:600px){

      .nav{
        min-height:68px;
      }

      .logo{
        font-size:20px;
      }

      .home-link{
        font-size:13px;
      }

      main{
        padding:55px 20px;
      }

      .error-number{
        letter-spacing:-5px;
        margin-bottom:24px;
      }

      h1{
        font-size:32px;
      }

      .description{
        font-size:15px;
      }

      .actions{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }

      .footer-content{
        flex-direction:column;
        text-align:center;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <div class="nav">

      <a
        href="index.html"
        class="logo">
        KROC LABS
      </a>

      <a
        href="index.html"
        class="home-link">
        Home →
      </a>

    </div>

  </header>


  <!-- 404 CONTENT -->

  <main>

    <div class="error-content">

      <div class="error-number">
        404
      </div>

      <div class="eyebrow">
        KROC LABS • PAGE NOT FOUND
      </div>

      <h1>
        This page doesn't exist.
      </h1>

      <p class="description">
        The page you're looking for may have been moved,
        deleted, or the address may be incorrect.
        Let's get you back to KROC LABS.
      </p>


      <div class="actions">

        <a
          href="index.html"
          class="btn primary">
          ← Back to KROC LABS
        </a>

        <a
          href="index.html#products"
          class="btn secondary">
          Explore Tools
        </a>

      </div>

    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <div class="footer-content">

      <div class="footer-brand">
        KROC LABS
      </div>

      <div class="footer-text">
        Useful technology. Built differently.
      </div>

    </div>

  </footer>


</body>
</html>
