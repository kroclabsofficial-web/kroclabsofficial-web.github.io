 <!-- JAVASCRIPT -->

<script>

function calculateEMI() {

  const loanAmountInput =
    document.getElementById("loanAmount");

  const interestRateInput =
    document.getElementById("interestRate");

  const loanTermInput =
    document.getElementById("loanTerm");

  const error =
    document.getElementById("emiError");

  const result =
    document.getElementById("emiResult");

  const monthlyEMI =
    document.getElementById("monthlyEMI");

  const totalInterest =
    document.getElementById("totalInterest");

  const totalPayment =
    document.getElementById("totalPayment");


  const loanAmount =
    Number(loanAmountInput.value);

  const annualRate =
    Number(interestRateInput.value);

  const years =
    Number(loanTermInput.value);


  /* VALIDATION */

  if (
    loanAmountInput.value.trim() === "" ||
    interestRateInput.value.trim() === "" ||
    loanTermInput.value.trim() === "" ||
    !Number.isFinite(loanAmount) ||
    !Number.isFinite(annualRate) ||
    !Number.isFinite(years) ||
    loanAmount <= 0 ||
    annualRate < 0 ||
    years <= 0
  ) {

    error.style.display = "block";
    result.style.display = "none";

    return;
  }


  /* CALCULATION */

  const numberOfPayments =
    Math.round(years * 12);

  const monthlyRate =
    annualRate / 100 / 12;

  let emi;


  /* ZERO INTEREST */

  if (monthlyRate === 0) {

    emi =
      loanAmount / numberOfPayments;

  }

  /* NORMAL EMI */

  else {

    const power =
      Math.pow(
        1 + monthlyRate,
        numberOfPayments
      );

    emi =
      loanAmount *
      monthlyRate *
      power /
      (power - 1);

  }


  const totalPaymentAmount =
    emi * numberOfPayments;

  const totalInterestAmount =
    totalPaymentAmount - loanAmount;


  /* SHOW RESULTS */

  monthlyEMI.textContent =
    emi.toLocaleString(undefined, {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });


  totalInterest.textContent =
    totalInterestAmount.toLocaleString(undefined, {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });


  totalPayment.textContent =
    totalPaymentAmount.toLocaleString(undefined, {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });


  error.style.display = "none";

  result.style.display = "block";


  /* SCROLL TO RESULT */

  result.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });

}


function resetEMI() {

  document.getElementById("loanAmount").value = "";

  document.getElementById("interestRate").value = "";

  document.getElementById("loanTerm").value = "";

  document.getElementById("emiError").style.display = "none";

  document.getElementById("emiResult").style.display = "none";

  document.getElementById("monthlyEMI").textContent = "0";

  document.getElementById("totalInterest").textContent = "0";

  document.getElementById("totalPayment").textContent = "0";

}


/* ENTER KEY SUPPORT */

document.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    const active =
      document.activeElement;

    if (
      active &&
      (
        active.id === "loanAmount" ||
        active.id === "interestRate" ||
        active.id === "loanTerm"
      )
    ) {

      calculateEMI();

    }

  }

});

</script>

</body>
</html>
